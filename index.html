<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dhadi Jatha Soba Singh Sitara</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    /* Super AMOLED Black Background Setup */
    body {
      margin: 0;
      font-family: 'Poppins', 'Noto Sans Gurmukhi', sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    /* Ambient Background Glow Effect */
    .glow-effect {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(151, 50, 34, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: -1;
      animation: pulse-glow 4s infinite alternate;
    }

    @keyframes pulse-glow {
      0% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
    }

    .card {
      max-width: 420px;
      padding: 20px 20px; 
      text-align: center;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    
    /* Profile Picture Container */
    .profile-pic-container {
      display: flex;
      justify-content: center;
      margin-bottom: 15px; 
      margin-top: 0; 
    }

    /* Inner Wrapper for placing the Gallery Icon relative to the pic */
    .profile-wrapper {
      position: relative;
      display: inline-block;
    }

    .profile-pic {
      width: 140px;
      height: 140px;
      object-fit: cover;
      object-position: calc(50% + 2px) -8px; 
      border-radius: 50%;
      border: 3px solid #973222; 
      animation: border-pulse 3s infinite;
      display: block;
      background-color: #000;
    }

    @keyframes border-pulse {
      0% { box-shadow: 0 0 0 0 rgba(151, 50, 34, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(151, 50, 34, 0); }
      100% { box-shadow: 0 0 0 0 rgba(151, 50, 34, 0); }
    }

    /* Apple-style Gallery Button */
    .gallery-btn {
      position: absolute;
      top: 5px;
      right: -55px; /* Adjust spacing outside the circle */
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      background: rgba(0,0,0,0.5);
      padding: 5px;
      border-radius: 8px;
    }
    
    .gallery-btn:hover {
      transform: scale(1.1);
    }
    
    .gallery-btn:active {
      transform: scale(0.95);
    }

    .gallery-btn svg {
      width: 28px;
      height: 28px;
      margin-bottom: 4px;
    }

    .gallery-btn span {
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: #fff;
    }

    /* Title Styling */
    .title-container {
      min-height: 70px; 
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0px; 
    }

    .title { 
      font-size: 22px; 
      font-weight: 700; 
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.3;
      transition: opacity 0.4s ease, filter 0.4s ease;
      opacity: 1;
      filter: blur(0px);
      white-space: nowrap; 
    }
    
    @media (max-width: 360px) {
      .title {
        white-space: normal;
        font-size: 20px;
      }
    }
    
    .title.switching {
      opacity: 0;
      filter: blur(5px);
    }
    
    /* Subtitle adjustment */
    .subtitle { 
      font-size: 13px; 
      opacity: 0.8; 
      margin-bottom: 4px; 
      font-weight: 300;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
    }

    /* --- CONTROLS CONTAINER --- */
    .controls-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px; 
      margin-bottom: 15px; 
      height: 20px;
      position: relative;
    }

    /* Common Switch Styles */
    .toggle-switch {
      position: relative;
      width: 36px;  
      height: 20px; 
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle-knob {
      position: absolute;
      top: 1px;
      left: 2px;
      width: 16px; 
      height: 16px;
      background-color: #973222;
      border-radius: 50%;
      color: white;
      font-size: 9px; 
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      box-shadow: 0 1px 2px rgba(0,0,0,0.5);
      user-select: none;
      line-height: 1;
    }

    .toggle-switch.active {
      border-color: #555;
      background-color: #2a2a2a;
    }

    .toggle-switch.active .toggle-knob {
      transform: translateX(16px); 
    }
    
    .toggle-knob.punjabi-font {
      font-size: 13px !important;
      padding-bottom: 2px;
    }

    .toggle-knob i {
      font-size: 8px; 
    }

    @keyframes jelly-infinite {
      0% { transform: scale(1, 1); }
      10% { transform: scale(1.25, 0.75); }
      15% { transform: scale(0.75, 1.25); }
      20% { transform: scale(1.15, 0.85); }
      25% { transform: scale(0.95, 1.05); }
      30% { transform: scale(1.05, 0.95); }
      35% { transform: scale(1, 1); }
      100% { transform: scale(1, 1); }
    }

    /* Links */
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      background-color: #000000;
      border: 1px solid #ffffff; 
      color: #ffffff;
      padding: 14px; 
      margin-bottom: 10px; 
      border-radius: 50px; 
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden; 
      animation: fadeInUp 0.8s ease backwards;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent; 
    }

    .link i { 
      color: #973222; 
      font-size: 20px; 
      position: absolute;
      left: 20px;
      z-index: 10;
      animation: jelly-infinite 3s infinite ease-in-out;
      pointer-events: none; 
    }
    
    .link:nth-child(5) i { animation-delay: 0s; }
    .link:nth-child(6) i { animation-delay: 0.2s; }
    .link:nth-child(7) i { animation-delay: 0.4s; }
    .link:nth-child(8) i { animation-delay: 0.6s; }
    .link:nth-child(9) i { animation-delay: 0.8s; } 
    .link:nth-child(10) i { animation-delay: 1.0s; } 

    .link:nth-child(5) { animation-delay: 0.1s; }
    .link:nth-child(6) { animation-delay: 0.2s; }
    .link:nth-child(7) { animation-delay: 0.3s; }
    .link:nth-child(8) { animation-delay: 0.4s; }
    .link:nth-child(9) { animation-delay: 0.5s; } 
    .link:nth-child(10) { animation-delay: 0.6s; } 

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .link span { position: relative; z-index: 5; pointer-events: none; }

    .link:hover { 
      border-color: #973222;
      background-color: #0a0a0a;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(151, 50, 34, 0.4);
    }
    
    .link:active {
      transform: scale(0.96) translateY(-2px); 
      background-color: #111;
      border-color: #973222;
    }

    .ripple {
      position: absolute;
      background: rgba(255, 255, 255, 0.3); 
      border-radius: 50%;
      transform: scale(0);
      animation: ripple-animation 0.6s linear;
      pointer-events: none;
    }

    @keyframes ripple-animation {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    .footer {
      margin-top: 25px; 
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.7;
      animation: fadeInUp 1s ease backwards;
      animation-delay: 0.8s;
    }
    .footer a {
      color: #ffffff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: none; 
      padding: 0;
      transition: opacity 0.3s ease;
    }
    
    .footer a:hover { opacity: 1; color: #973222; }
    
    .footer i { 
      color: #973222; 
      display: inline-block;
      animation: jelly-infinite 3s infinite ease-in-out; 
    }

    /* --- GALLERY MODAL STYLING --- */
    .gallery-modal {
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      flex-direction: column;
      overflow-y: auto;
      backdrop-filter: blur(5px);
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 25px;
      background-color: #050505;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .gallery-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .close-gallery {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .close-gallery:hover {
      color: #973222;
    }

    /* Tabs */
    .gallery-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 20px 25px;
      justify-content: center;
    }

    .tab-btn {
      background: #111;
      border: 1px solid #333;
      color: #ccc;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .tab-btn:hover {
      background: #222;
      border-color: #555;
      color: #fff;
    }

    .tab-btn.active {
      background: #973222;
      border-color: #973222;
      color: #fff;
      box-shadow: 0 2px 8px rgba(151, 50, 34, 0.4);
    }

    /* Image Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
      padding: 0 25px 40px 25px;
    }

    .gallery-item {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #222;
      background-color: #111;
      transition: transform 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
    }

    .gallery-item:hover {
      transform: scale(1.05);
      border-color: #973222;
      z-index: 2;
    }

    .loader-text {
      width: 100%;
      grid-column: 1 / -1;
      text-align: center;
      color: #777;
      font-size: 14px;
      padding: 20px;
    }
  </style>
</head>
<body>
  
  <div class="glow-effect"></div>
  
  <audio id="bgAudio" loop>
    <source src="music.mp3" type="audio/mp3">
  </audio>

  <div class="card">
    
    <div class="profile-pic-container">
      <div class="profile-wrapper">
        <img src="profile.jpg" alt="Dhadi Jatha Soba Singh Sitara" class="profile-pic">
        
        <div class="gallery-btn" onclick="openGallery()" title="Open Photo Gallery">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(50 50)">
              <path d="M0,0 C15,-25 35,-25 35,0 C35,15 15,15 0,0" fill="#973222" opacity="0.9" transform="rotate(0)"/>
              <path d="M0,0 C15,-25 35,-25 35,0 C35,15 15,15 0,0" fill="#fff" opacity="0.7" transform="rotate(45)"/>
              <path d="M0,0 C15,-25 35,-25 35,0 C35,15 15,15 0,0" fill="#973222" opacity="0.9" transform="rotate(90)"/>
              <path d="M0,0 C15,-25 35,-25 35,0 C35,15 15,15 0,0" fill="#fff" opacity="0.7" transform="rotate(135)"/>
              <path d="M0,0 C15,-25 35,-25 35,0 C35,15 15,15 0,0" fill="#973222" opacity="0.9" transform="rotate(180)"/>
              <path d="M0,0 C15,-25 35,-25 35,0 C35,15 15,15 0,0" fill="#fff" opacity="0.7" transform="rotate(225)"/>
              <path d="M0,0 C15,-25 35,-25 35,0 C35,15 15,15 0,0" fill="#973222" opacity="0.9" transform="rotate(270)"/>
              <path d="M0,0 C15,-25 35,-25 35,0 C35,15 15,15 0,0" fill="#fff" opacity="0.7" transform="rotate(315)"/>
            </g>
          </svg>
          <span>Gallery</span>
        </div>
      </div>
    </div>

    <div class="title-container">
      <div class="title" id="mainTitle">Dhadi Jatha Soba Singh<br>Sitara</div>
    </div>
    
    <div class="subtitle">Official Social Links</div>

    <div class="controls-wrapper">
      <div class="toggle-switch" onclick="toggleLanguage()" id="langSwitch" title="Switch Language">
        <div class="toggle-knob" id="langKnob">A</div>
      </div>
      <div class="toggle-switch" onclick="toggleMusic()" id="musicSwitch" title="Play/Pause Music">
        <div class="toggle-knob" id="musicKnob">
          <i class="fas fa-play"></i>
        </div>
      </div>
    </div>
    
    <a class="link" href="https://youtube.com/@sobasinghsitara">
      <i class="fab fa-youtube"></i><span>YouTube</span>
    </a>
    <a class="link" href="https://www.facebook.com/share/1DUBKj8yUk/">
      <i class="fab fa-facebook"></i><span>Facebook</span>
    </a>
    <a class="link" href="https://www.instagram.com/sobasinghsitara">
      <i class="fab fa-instagram"></i><span>Instagram</span>
    </a>
    <a class="link" href="https://wa.me/919888861222">
      <i class="fab fa-whatsapp"></i><span>WhatsApp</span>
    </a>
    <a class="link" href="https://www.snapchat.com/add/soba.singh">
      <i class="fab fa-snapchat"></i><span>Snapchat</span>
    </a>
    <a class="link" href="https://open.spotify.com/artist/5bEZhDOR9jL5FhLNYaWDqv">
      <i class="fab fa-spotify"></i><span>Spotify</span>
    </a>

    <div class="footer">
      <a href="https://www.instagram.com/dactor.in/" target="_blank">
        <i class="fab fa-instagram"></i><span>Made by Dactor</span>
      </a>
    </div>

  </div>

  <div class="gallery-modal" id="galleryModal">
    <div class="gallery-header">
      <h2>Photo Gallery</h2>
      <button class="close-gallery" onclick="closeGallery()"><i class="fas fa-times"></i></button>
    </div>
    
    <div class="gallery-tabs">
      <button class="tab-btn active" id="tab-1" onclick="loadSection(1)">Shows</button>
      <button class="tab-btn" id="tab-2" onclick="loadSection(2)">Achievements</button>
      <button class="tab-btn" id="tab-3" onclick="loadSection(3)">With Team</button>
      <button class="tab-btn" id="tab-4" onclick="loadSection(4)">Random</button>
      <button class="tab-btn" id="tab-5" onclick="loadSection(5)">Projects</button>
      <button class="tab-btn" id="tab-6" onclick="loadSection(6)">Tour</button>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      </div>
  </div>

  <script>
    // --- 1. Language Toggle Logic ---
    const titleElement = document.getElementById('mainTitle');
    const langSwitch = document.getElementById('langSwitch');
    const langKnob = document.getElementById('langKnob');
    let isEnglish = true;
    const textEn = "Dhadi Jatha Soba Singh<br>Sitara";
    const textPa = "ਢਾਡੀ ਜਥਾ ਸੋਭਾ ਸਿੰਘ<br>ਸਿਤਾਰਾ";

    function toggleLanguage() {
      titleElement.classList.add('switching');
      isEnglish = !isEnglish;
      
      if (!isEnglish) {
        langSwitch.classList.add('active'); 
        setTimeout(() => { 
            langKnob.textContent = "ੳ"; 
            langKnob.classList.add('punjabi-font'); 
        }, 100); 
      } else {
        langSwitch.classList.remove('active'); 
        setTimeout(() => { 
            langKnob.textContent = "A"; 
            langKnob.classList.remove('punjabi-font'); 
        }, 100);
      }

      setTimeout(() => {
        titleElement.innerHTML = (!isEnglish) ? textPa : textEn;
        titleElement.classList.remove('switching');
      }, 300);
    }

    // --- 2. Music Toggle Logic ---
    const musicSwitch = document.getElementById('musicSwitch');
    const musicKnob = document.getElementById('musicKnob');
    const bgAudio = document.getElementById('bgAudio');
    let isMusicPlaying = false;

    function toggleMusic() {
      if (!isMusicPlaying) {
        bgAudio.play().catch(error => console.log("Audio play failed:", error));
        musicSwitch.classList.add('active');
        setTimeout(() => { musicKnob.innerHTML = '<i class="fas fa-pause"></i>'; }, 100);
        isMusicPlaying = true;
      } else {
        bgAudio.pause();
        musicSwitch.classList.remove('active');
        setTimeout(() => { musicKnob.innerHTML = '<i class="fas fa-play"></i>'; }, 100);
        isMusicPlaying = false;
      }
    }

    // --- 3. Ripple Effect Logic ---
    const links = document.querySelectorAll('.link');
    links.forEach(btn => {
      btn.addEventListener('click', function(e) {
        let ripple = document.createElement('span');
        let rect = btn.getBoundingClientRect();
        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.classList.add('ripple');
        let size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.marginLeft = -size/2 + 'px';
        ripple.style.marginTop = -size/2 + 'px';
        btn.appendChild(ripple);
        setTimeout(() => { ripple.remove(); }, 600);
      });
    });

    // --- 4. Fullscreen logic ---
    document.addEventListener('click', function(e) {
      if(e.target.closest('a') || e.target.closest('.toggle-switch') || e.target.closest('.gallery-btn') || e.target.closest('.gallery-modal')) return;
      var elem = document.documentElement;
      if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        if (elem.requestFullscreen) { elem.requestFullscreen().catch(err => console.log(err)); }
      }
    });

    // --- 5. GALLERY LOGIC ---
    let currentSection = 1;
    const loadedImagesCache = {}; // Caches successful images to avoid reloading

    function openGallery() {
      document.getElementById('galleryModal').style.display = 'flex';
      document.body.style.overflow = 'hidden'; // stop background scroll
      loadSection(1);
    }

    function closeGallery() {
      document.getElementById('galleryModal').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    function loadSection(sectionId) {
      currentSection = sectionId;
      
      // Update UI Tabs
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-' + sectionId).classList.add('active');

      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '<div class="loader-text">Loading photos...</div>';

      // Load from cache if already fetched
      if (loadedImagesCache[sectionId]) {
        renderGallery(loadedImagesCache[sectionId]);
        return;
      }

      // Auto-fetch logic based on your naming convention (sectionX.Y.jpg)
      let successfulImages = [];
      let photoIndex = 1;

      function checkNextImage() {
        let img = new Image();
        let imgName = `section${sectionId}.${photoIndex}.jpg`; // Expecting .jpg extension

        img.onload = function() {
          successfulImages.push(imgName);
          photoIndex++;
          checkNextImage(); // Try next number
        };

        img.onerror = function() {
          // As soon as a number fails (404), stop searching and render what we have
          loadedImagesCache[sectionId] = successfulImages;
          renderGallery(successfulImages);
        };

        img.src = imgName;
      }

      checkNextImage(); // Start the loop
    }

    function renderGallery(imageArray) {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      if (imageArray.length === 0) {
        grid.innerHTML = '<div class="loader-text">No photos uploaded in this section yet.</div>';
        return;
      }

      imageArray.forEach(src => {
        let imgEl = document.createElement('img');
        imgEl.src = src;
        imgEl.className = 'gallery-item';
        
        // Optional: click photo to view full size in new tab
        imgEl.onclick = function() { window.open(src, '_blank'); };
        
        grid.appendChild(imgEl);
      });
    }
  </script>
</body>
</html>
